# C++ CI workflow
# 每次 push 或提 PR 时自动编译所有练习并运行全量测试

name: CI

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  cpp-build-test:
    name: Build & Test (C++20)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build all exercises
        run: xmake

      - name: Run all tests
        run: xmake run summary
